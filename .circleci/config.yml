version: 2.1

jobs:
  quality: &test-template
    description: Code style
    docker:
      - image: python:3.12
    environment:
      PIP_PREFER_BINARY: true
      PIP_PROGRESS_BAR: "off"
      TOXENV: style
    steps:
      - checkout
      - run: python -m pip install tox
      - run: tox

  tests312-fast:
    <<: *test-template
    description: Tests fast - Python 3.12
    environment:
      TOXENV: tests312-fast

  tests312-online:
    <<: *test-template
    description: Tests online - Python 3.12
    environment:
      TOXENV: tests312-online

  tests312-slow:
    <<: *test-template
    description: Tests slow - Python 3.12
    environment:
      TOXENV: tests312-slow

  tests312-images:
    <<: *test-template
    description: Tests images - Python 3.12
    environment:
      TOXENV: tests312-images

  tests312-coverage:
    <<: *test-template
    description: Tests coverage - Python 3.12
    environment:
      TOXENV: tests312-coverage
    steps:
      - checkout
      - run: python -m pip install tox
      - run: tox
      - run: python -m pip install codecov && codecov

  tests313:
    <<: *test-template
    description: Tests - Python 3.13
    docker:
      - image: python:3.13
    environment:
      TOXENV: tests313

  tests314:
    <<: *test-template
    description: Tests - Python 3.14
    docker:
      - image: python:3.14
    environment:
      TOXENV: tests314

workflows:
  version: 2
  build_and_test:
    jobs:
      - quality
      - tests312-fast:
          requires:
            - quality
      - tests312-online:
          requires:
            - quality
      - tests312-slow:
          requires:
            - quality
      - tests312-images:
          requires:
            - quality
      - tests312-coverage:
          requires:
            - quality
      - tests313:
          requires:
            - quality
      - tests314:
          requires:
            - quality
