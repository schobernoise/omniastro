[build-system]
requires = [
    "flit_core >=3.4,<4",
    "wheel",
]
build-backend = "flit_core.buildapi"

[project]
name = "poliastro"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "COPYING"}
authors = [
    {name = "Juan Luis Cano Rodríguez", email = "hello@juanlu.space"}
]
maintainers = [
    {name = "Juan Luis Cano Rodríguez", email = "hello@juanlu.space"},
    {name = "Jorge Martinez Garrido", email = "contact@jorgemartinez.space"},
    {name = "Fabian Schober", email = "reach@fabianschober.com"}
]
keywords = [
    "aero",
    "aerospace",
    "engineering",
    "astrodynamics",
    "orbits",
    "kepler",
    "orbital mechanics"
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy >=6.0",
    "astroquery >=0.4.6",
    "jplephem >=2.15",
    "matplotlib >=3.7",
    "numba >=0.59",
    "numpy >=1.25",
    "pandas >=2.0",
    "plotly >=5.0",
    "pyerfa >=2.0",
    "scipy >=1.12",
]
dynamic = ["version", "description"]

[project.urls]
Documentation = "https://docs.poliastro.space"
Source = "https://github.com/schobernoise/omniastro"
Tracker = "https://github.com/schobernoise/omniastro/issues"
UpstreamProject = "https://github.com/poliastro/poliastro"

[project.optional-dependencies]
jupyter = ["notebook>=7.0", "ipywidgets>=8.0"]
cesium = ["czml3 >=0.5.3,<0.6"]
doc = [
    "httpx",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "jupyter-client>=8.0",
    "jupytext>=1.16",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "nbconvert>=7.0",
    "sgp4",
    "sphinx>=7.0",
    "sphinx-autoapi>=3.0",
    "sphinx-gallery>=0.15",
    "sphinx_rtd_theme>=2.0",
    "sphinx-hoverxref>=1.3",
    "sphinx-notfound-page",
    "sphinx-copybutton>=0.5",
    "sphinx-github-role>=0.1.0",
]
test = [
    "coverage",
    "hypothesis",
    "import-linter[toml]",
    "mypy>=1.8",
    "pre-commit",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-doctestplus>=1.0",
    "pytest-mpl",
    "pytest-mypy",
    "pytest-remotedata",
    "tox",
]

[tool.flit.sdist]
include = [
    "src/poliastro/atmosphere/data/coesa62.dat",
    "src/poliastro/atmosphere/data/coesa76.dat",
    "src/poliastro/atmosphere/data/coesa76_p.dat",
    "src/poliastro/atmosphere/data/coesa76_rho.dat",
    "setup.cfg"
]
exclude = [
    "docs/"
]

[tool.black]
line-length = 79

[tool.ruff]
select = [
    "E",  # pycodestyle, see https://github.com/charliermarsh/ruff#pycodestyle-e-w
#    "D",  # pydocstyle, see https://github.com/charliermarsh/ruff#pydocstyle-d
    "F",  # pyflakes, see https://github.com/charliermarsh/ruff#pyflakes-f
    "I"   # isort, see https://github.com/charliermarsh/ruff#isort-i
]

ignore = [
    "E501",  # Line too long. Ignoring this so "black" manages line length.
]

exclude = [
    ".git",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["poliastro"]

[tool.ruff.mccabe]
max-complexity = 18

[tool.mypy]
check_untyped_defs = true
strict_optional = false
ignore_missing_imports = true

[tool.coverage.paths]
source = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
omit = ["contrib/*"]
show_missing = true

[tool.importlinter]
# Include Astropy to properly analyze external submodules,
# see https://github.com/seddonym/import-linter/issues/111
root_packages = ["poliastro", "astropy"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "poliastro.core does not import astropy.units"
type = "forbidden"
source_modules = ["poliastro.core"]
forbidden_modules = ["astropy.units"]

[tool.pytest.ini_options]
norecursedirs = [".git", ".tox", "dist", "build", ".venv"]
testpaths = ["tests"]
python_files ="test_*.py"
doctest_plus = false
addopts = ["--strict-markers"]
markers = ["slow", "remote_data", "filterwarnings", "mpl_image_compare"]
